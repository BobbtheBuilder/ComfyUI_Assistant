name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: |
          py=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          init=$(grep -m1 '__version__' __init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "pyproject=$py init=$init ref=${GITHUB_REF_NAME} type=${GITHUB_REF_TYPE}"
          test "$py" = "$init"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME}" = "v$py"; fi
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
